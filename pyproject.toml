[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "leitum"
version = "0.2.0"
description = "Launch Claude Code against alternative LLM routers"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Rene Gielen" }]
keywords = ["cli", "claude-code", "llm", "router"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.12",
    "questionary>=2.0",
    "pydantic>=2.7",
    "ruamel.yaml>=0.18",
    "httpx>=0.27",
    "rich>=13",
]

[project.urls]
Homepage  = "https://github.com/rgielen/leitum"
Repository = "https://github.com/rgielen/leitum"
Issues    = "https://github.com/rgielen/leitum/issues"
Changelog = "https://github.com/rgielen/leitum/blob/main/CHANGELOG.md"

[project.scripts]
leitum = "leitum.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "respx>=0.21",
    "freezegun>=1.5",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-freezegun",
]
# Kept out of `dev` so the CI test matrix does not install it. The release
# workflow pulls it in with `uv sync --group release`. Pinned exactly: the
# release engine must not change under us on an unrelated run.
release = [
    "python-semantic-release==10.6.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/leitum"]

[tool.ruff]
line-length = 100
exclude = ["design/"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "PTH"]
ignore = ["B008"]

[tool.mypy]
strict = true
python_version = "3.11"
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.semantic_release]
# Releases are derived from Conventional Commits; see
# prd/09-dependency-and-release-automation.md. Never bump the version by hand.
version_toml = ["pyproject.toml:project.version"]
commit_parser = "conventional"
tag_format = "v{version}"
# The project is deliberately pre-1.0, so a breaking change bumps the minor
# (0.1.6 -> 0.2.0) instead of jumping to 1.0.0.
allow_zero_version = true
major_on_zero = false
commit_message = "chore(release): {version}\n\nAutomatically generated by python-semantic-release"
commit_author = "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
# Keeps the leitum entry in uv.lock in step with the new version and stages it
# into the release commit. $PACKAGE_NAME is provided by PSR from project.name.
build_command = """
uv lock --upgrade-package "$PACKAGE_NAME"
git add uv.lock
uv build
"""

[tool.semantic_release.changelog]
# Both values are PSR defaults; stated explicitly because CHANGELOG.md carries
# the marker and a PSR default change would silently rewrite the file header.
mode = "update"
insertion_flag = "<!-- version list -->"

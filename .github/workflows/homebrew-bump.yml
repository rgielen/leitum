name: Homebrew Bump

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag (e.g. v0.1.4) to bump the tap to
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v0.1.4) to bump the tap to
        required: true
        type: string

permissions:
  contents: read

# Called by release.yml with the tag semantic-release produced, or dispatched by
# hand to re-run a bump. It used to hang off `workflow_run: ["Release"]` and read
# the tag from `head_branch`, which only worked while Release was tag-triggered.
#
# We deliberately do NOT use `brew bump-formula-pr` / action-homebrew-bump-formula
# here. For a Python virtualenv formula, recent Homebrew auto-resolves the
# transitive resource set via pip with `--uploaded-prior-to = now - 24h`, which
# excludes the version we just published (uploaded minutes ago) and fails every
# run with "Unable to determine dependencies ... update the resources manually".
#
# Instead this job only bumps the formula `url` + `sha256` from PyPI and opens a
# PR. The resource blocks are left untouched: they only need regenerating when a
# transitive dependency drifts, which is a human/skill responsibility (see the
# `homebrew-tap-bump` project skill). Verify with `brew install --build-from-source`
# before merging — the tap has no CI.
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Bump leitum formula (url + sha256) and open a tap PR
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          echo "Bumping leitum Homebrew formula to ${VERSION}"

          # PyPI's JSON API is served through a CDN and can lag a minute or two
          # behind the publish that triggered this workflow — retry until it sees
          # the new version.
          JSON=""
          for i in $(seq 1 30); do
            if JSON=$(curl -fsS "https://pypi.org/pypi/leitum/${VERSION}/json"); then
              break
            fi
            echo "PyPI does not yet serve ${VERSION} (attempt ${i}/30); waiting..."
            sleep 10
          done
          if [ -z "${JSON}" ]; then
            echo "::error::PyPI never served leitum ${VERSION}"; exit 1
          fi

          # `first(...)` keeps these scalar even if PyPI ever lists more than one
          # sdist; `// ""` yields empty (not "null") when there is none.
          URL=$(printf '%s' "${JSON}" | jq -r 'first(.urls[] | select(.packagetype=="sdist") | .url) // ""')
          SHA=$(printf '%s' "${JSON}" | jq -r 'first(.urls[] | select(.packagetype=="sdist") | .digests.sha256) // ""')
          if [ -z "${URL}" ] || [ -z "${SHA}" ]; then
            echo "::error::Could not resolve an sdist url/sha256 for leitum ${VERSION}"; exit 1
          fi
          echo "url    = ${URL}"
          echo "sha256 = ${SHA}"

          # Authenticate git via gh's credential helper (uses GH_TOKEN) so no
          # token is embedded in a remote URL or left in .git/config.
          gh auth setup-git
          git clone --depth 1 https://github.com/rgielen/homebrew-taps.git tap
          cd tap
          FORMULA="Formula/leitum.rb"

          # Rewrite only the top-level (2-space indented) url + sha256 lines by
          # replacing the whole line — this avoids awk sub()'s `&` semantics on the
          # interpolated URL. Fail loudly if either line is not found, so a formula
          # format change cannot silently produce a no-op "already at" success.
          if ! awk -v url="${URL}" -v sha="${SHA}" '
            !u && /^  url /    { $0 = "  url \""    url "\""; u = 1 }
            !s && /^  sha256 / { $0 = "  sha256 \"" sha "\""; s = 1 }
            { print }
            END { exit (u && s) ? 0 : 3 }
          ' "${FORMULA}" > "${FORMULA}.tmp"; then
            echo "::error::Could not locate the top-level url/sha256 lines in ${FORMULA}"
            rm -f "${FORMULA}.tmp"; exit 1
          fi
          mv "${FORMULA}.tmp" "${FORMULA}"

          if git diff --quiet -- "${FORMULA}"; then
            echo "Formula is already at ${VERSION}; nothing to do."
            exit 0
          fi
          git --no-pager diff -- "${FORMULA}"

          BRANCH="leitum-${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "${BRANCH}"
          git commit -am "leitum ${VERSION}"
          git push --force-with-lease -u origin "${BRANCH}"

          if gh pr view "${BRANCH}" --repo rgielen/homebrew-taps >/dev/null 2>&1; then
            echo "A PR for ${BRANCH} already exists; updated its branch."
          else
            gh pr create \
              --repo rgielen/homebrew-taps \
              --base main --head "${BRANCH}" \
              --title "leitum ${VERSION}" \
              --body "Bumps the \`leitum\` formula \`url\` + \`sha256\` to ${VERSION} (from PyPI).

          The transitive Python resource blocks were **not** regenerated. If this release changed the dependency set, regenerate them before merging (see the \`homebrew-tap-bump\` skill). The tap has no CI, so verify locally first:

          \`\`\`
          brew install --build-from-source rgielen/taps/leitum
          brew audit --strict rgielen/taps/leitum
          brew test rgielen/taps/leitum
          \`\`\`"
          fi
